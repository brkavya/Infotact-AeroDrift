name: AeroDrift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest rich networkx boto3

      - name: Create logs directory
        run: |
          mkdir -p logs

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Verify Topology Engine
        env:
          PYTHONPATH: .
        run: |
          python topology.py

      - name: Verify Remediation Engine
        env:
          PYTHONPATH: .
        run: |
          python remediation.py